name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: 脚本换行符自检(tests/*.sh 不得含裸 CR)
        # 裸 CR 会在 Linux 上破坏脚本(曾导致 tr 剥离回车失效,批量 OAuth 用例失败);
        # 需要剔除 CR 时请写 tr -d '\r' 的转义形式,不要嵌真的控制字符。
        run: |
          fail=0
          for f in $(git ls-files 'tests/*.sh'); do
            n=$(tr -cd '\r' < "$f" | wc -c)
            if [ "$n" -gt 0 ]; then echo "$f 含 $n 处裸 CR"; fail=1; fi
          done
          exit $fail
      - name: PHP lint(全部 PHP 文件)
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" || fail=1
          done < <(git ls-files '*.php')
          exit $fail
      - name: JS 语法检查(排除 vendor)
        run: |
          fail=0
          while IFS= read -r f; do
            case "$f" in vendor/*) continue;; esac
            node --check "$f" || fail=1
          done < <(git ls-files '*.js')
          exit $fail
      - name: 发版产物新鲜度(min/版本号/checksums 与源码一致)
        # release.mjs 幂等:重跑后无 diff 说明 .min 与源码同步、HTML ?v= 与 TC_VERSION
        # 一致、sw 缓存名已联动、checksums.txt 是最新。有 diff = 忘跑发版工具。
        run: node tools/release.mjs && git diff --exit-code
      - name: 图标匹配自检(规则目标文件必须存在 + 关键模型命中)
        run: node tests/logos-check.js
      - name: 主题包契约自检(规则不得漏进默认外观 / 入口位置 / 白名单)
        # 主题样式表少写一条属性前缀,那条规则就会漏进默认外观,而默认外观必须与引入
        # 主题市场之前逐像素一致 —— 这种走样不报错、只在界面上静静变样,用静态约定挡住。
        run: node tests/theme-pack.js
      - name: WAF 路径自检(文件名/路由不得含主机拦截关键词)
        # 免费虚拟主机(InfinityFree)的边缘 WAF 会拦 URL 里含 chat 的请求,连静态资源
        # 与页面路由也返回 403,且发生在 .htaccess 之前 —— 只能靠改名字避开。
        # 这类问题在自建服务器上永远复现不了,用静态扫描挡住回归。
        run: node tests/waf-paths.js
      - name: 在线浏览器 iframe 沙箱契约自检(不得带 allow-same-origin / escape-sandbox)
        # 被代理页由本站服务器转发,在浏览器眼里是同源文档;唯一防线是 iframe 的 sandbox
        # 属性里不带 allow-same-origin。曾误带 allow-popups-to-escape-sandbox:弹窗会完全
        # 脱离沙箱、且垫片把 window.open 改写成本站同源地址,于是能直读 localStorage 里的
        # 令牌。功能照常、界面上看不出任何异常,只是属性里多一个词 —— 读代码极易看漏。
        run: node tests/web-frame-sandbox.js
      - name: 在线工具箱沙箱契约自检(iframe 不得带 allow-same-origin / 工具页 CSP sandbox)
        # 工具箱存的是用户自己的任意 HTML,服务端刻意不清洗它 —— 隔离全靠「不透明来源」,
        # 两条打开路径各有一道:预览用 iframe sandbox 属性(不带 allow-same-origin),
        # 新标签页用 /api/toolbox/page 响应头里的 CSP sandbox。少了任何一道,用户工具里
        # 一段 fetch('/api/me') 就能读到登录令牌。属性少一个词,界面完全看不出区别。
        run: node tests/toolbox-sandbox.js
      - name: AI 整理解析自检(弱模型畸形输出 / 降级格式 / 输入裁剪)
        run: node tests/notes-archive.js
      - name: 弹窗框架契约自检(关闭回调不递归爆栈 / Esc 链路)
        run: node tests/modal-close.js
      - name: 注册邮箱必填标签自检(开启邮箱验证后去掉「(可选)」/ 两处注册表单都接线)
        # 开启邮箱验证后注册接口会拒掉空邮箱,可标签还写着「(可选)」—— 用户照它留空提交,
        # 只会收到一句后端报错。少接一处(登录页与主站弹窗)时功能照常,只有提示是错的。
        run: node tests/register-email-label.js
      - name: 设置云同步合并自检(逐键时间戳 / 删除墓碑 / 快照往返)
        run: node tests/settings-merge.js
      - name: 安全修复源码契约自检(协议白名单 / postMessage 来源 / 媒体输出加固 / 反原型污染)
        # 这一轮安全审计修的多是「少写一个词、功能照常、只是不再安全」的问题:漏改一条出图
        # 路径就等于没改,漏一次来源判断就能被任意站点驱动。读 diff 看不出来,钉成契约挡回归。
        run: node tests/security-contracts.js
      - name: 用户设置云同步自检(白名单收敛 / 分片落库 / 注销清理)
        run: php tests/settings-sync.php
      - name: 内置模型元数据自检(注入 / 不覆盖手工与同步 / 同步跳过内置)
        run: php tests/model-meta-builtin.php
      - name: 模型汇总自检(同名自动生成与清理 / 候选按可见性与授权过滤 / 轮询游标 / 请求解析展开 / 白名单)
        # 这几段写错了都不报错:多过滤一步是「用户明明能用却被告知没有可用渠道」,
        # 少过滤一步是越权用到未授权的渠道;总开关关闭时多做了事则等于没关掉。
        run: php tests/model-groups.php
      - name: 演示管理员还原自检(拍摄/到期还原/反复还原)
        run: php tests/demo-revert.php
      - name: 生图响应解析自检(各平台返回形态)
        run: php tests/image-parse.php
      - name: 网页正文提取自检(裸 < 不吞正文 / 导航瘦身 / 注释清理)
        run: php tests/html-text.php
      - name: 上游地址拼接自检(补 /v1 / 不重复)
        run: php tests/upstream-url.php
      - name: 上游状态码回传自检(401/402/403 归一为 502 / 真登录失效仍 401)
        # 本站也用 401/402/403 表达登录态/额度/权限,前端收到 401 会直接登出跳登录页。
        # 把上游的同类码原样透传,「供应商 Key 填错」就会被误判成「登录过期」——
        # 这类问题只在真发消息时出现,读 diff 看不出来,钉成契约挡回归。
        run: php tests/upstream-status.php
      - name: 出站代理自检(scheme 映射 http/https/socks4/socks4a/socks5/socks5h / 非法串被拒 / 直连)
        # 代理只在「scheme -> CURLOPT_PROXYTYPE」这一处映射:少写一个 scheme 会让那类代理
        # 静默退化成 HTTP 代理(连不上又不报错),非法串则可能被原样塞进 curl。静态断言挡住回归。
        run: php tests/outbound-proxy.php
      - name: 内网上游开关自检(默认拒绝本地/内网 / 开启后放行 / 底线仍守 / 环境变量来源)
        # 这个开关临时解除 SSRF 防线:默认必须关闭、开启后仍拒绝带凭据 URL 与非 http(s) 协议、
        # 设置归一化只认布尔真值 —— 任一处写松了都等于把「读内网」的能力默认开放出去。
        run: php tests/private-upstream.php
      - name: 署名完整性守卫自检(篡改拦截 / 合法放行)
        run: php tests/attribution.php
      - name: 本地存储契约自检(大块键不得直接走 localStorage / 读前先开库 / 迁移顺序)
        # 会话与笔记这几处少改一个调用点,那一处就继续受 localStorage 那 5MB 限制 ——
        # 功能照常、界面照常,只有用户的图存不住。这类「读代码看不出来」的差异钉成契约;
        # 真行为由 tests/local-store-gui.mjs 在真浏览器里量。
        run: node tests/local-store.js
      - name: 正文内联图片契约自检(三处正文组装 / 预算小于服务端上限 / 拿不到缩略图就不内联)
        # 一张图在消息里有两个去处:attachments 里的原图,与 content 里那份内联副本。
        # **聊天分享只带走 role+content**,所以那份内联副本不能省;但 content 有 200000 字符
        # 上限,内联原图会被整段切掉 —— 分享页反而没图。现在只内联缩略图。这类「少改一处就
        # 悄悄退化」的地方钉成契约;真实体积与分享页效果由 chat-image-preview-gui.mjs 量。
        run: node tests/chat-image-inline.js
      - name: 生图图片代理自检(签名 / SSRF 防护 / 媒体类型收紧 / 协议白名单)
        run: php tests/image-proxy.php
      - name: 对话式生图/改图自检(抽图 / 参考图 / 兜底识别)
        run: php tests/image-chat.php
      - name: 虚拟主机配额自检(cgroup v1/v2 解析与双采样)
        run: php tests/sys-quota.php
      - name: 流式采集自检(SSE 事件跨 TCP 分片 / 尾部收尾)
        run: php tests/stream-capture.php
      - name: JSON 边车文件并发自检(登录计数 / 附件索引 / 笔记 AI 配额)
        run: php tests/json-sidecars.php
      - name: 在线聊天自检(AI 触发边界 / 好友请求语义 / 单聊复用 / immsg 与 imdel 分片落库)
        run: php tests/im-social.php
      - name: 在线浏览器代理自检(票据验签 / URL 绝对化 / SSRF / HTML·CSS 改写 / cookie jar)
        run: php tests/web-proxy.php
      - name: 在线工具箱自检(读写与修订号 / 清洗与上限 / 墓碑 / 签名页面地址 / 开关矩阵)
        # 「超限必须明确报错而不是静默截断」是这里最容易退化的点:静默丢弃时用户看到的是
        # 「保存成功但少了一个工具」,不报错也不丢数据的样子最难排查。tc_fail() 会 exit,
        # 这些路径只能在子进程里验(与 sys-quota / json-sidecars 同一手法)。
        run: php tests/toolbox.php
      - name: 拓展功能可见性自检(默认语义 / 仅管理员 / 名单 / 用户组 / 境内 IP 段二分查找)
        run: php tests/feature-access.php
      - name: 对话云同步截断自检(截断点必须落在 Markdown 之外 / 图片本体靠附件承载)
        # 用户消息 content 里内联着几十万字符的 base64 图片,截断点落在 base64 中间时
        # 渲染端只能当文字画出来 —— 这种「只有换设备才复现」的问题,靠 PHP 侧断言截断形状。
        run: php tests/chat-sync-trunc.php

  e2e:
    name: E2E(PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: 运行 E2E 套件
        run: bash tests/e2e.sh
      # 模型汇总的故障转移/轮询只在真实运行期成立:单元自检只覆盖「选哪些候选」的静态规则,
      # 「第一个渠道打不通时请求真的落到下一个、轮询真的两边轮」必须起真服务 + 多个 mock 上游
      # 才验得出来(mock 用 TC_MOCK_TAG 区分应答,断言据此判断回复来自哪个渠道)。
      - name: 模型汇总 E2E(同名自动汇总 / 自定义汇总 ID / 跨渠道故障转移 / 轮询)
        run: bash tests/model-groups-e2e.sh

  gui:
    name: AI 整理弹窗(GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      # 弹窗是 DOM 接线问题,单测覆盖不到:必须真浏览器按用户路径点一遍
      - name: 安装 Playwright(含 Chromium)
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: AI 整理弹窗自检(桌面 / 移动视口 / 弱模型坏输出)
        run: node tests/notes-archive-gui.mjs
      - name: 对话页 @引用 自检(残留 @ / 回显配色 / 不重复不挤窄 / 窄屏)
        run: node tests/chat-mentions-gui.mjs
      # 会话项整行的 click 会重渲染侧栏,把正在编辑的重命名输入框换掉 → 一点就提交。
      # 这种「点了反而不能改」的接线问题只能真浏览器点出来。
      - name: 对话重命名自检(点进输入框仍在编辑 / 回车才提交 / Esc 不写回)
        run: node tests/chat-rename-gui.mjs
      # 窄屏侧栏此前恒在屏外(-100%)且没有任何规则能移回来,手机上进不了笔记;
      # 这类「点了没反应」的接线/断点问题只能真浏览器点出来。
      - name: 移动端笔记侧栏自检(抽屉开启 / 遮罩收起 / 选中即收 / 宽屏不受影响)
        run: node tests/notes-mobile-gui.mjs
      - name: 移动端笔记其它界面自检(分屏退化 / 分享弹窗 / 顶栏可达 / 新建)
        run: node tests/notes-mobile-gui2.mjs
      # 「点了没反应」类问题(弹窗爆栈、控件排在屏外)只有真浏览器点得出来
      - name: 笔记编辑器自检(已分享管理可打开 / 窄屏能编辑 / 顶栏对齐)
        run: node tests/notes-editor-gui.mjs
      # 列表页 AI 与「改前改后对照」都是纯前端交互:菜单分组少了、预览被跳过直接改写,
      # 静态检查看不出来,只有真浏览器点得出。
      - name: 笔记 AI 交互自检(列表菜单 AI 组 / 生成标题确认 / 选区编辑对照预览 / 摘要先预览)
        run: node tests/notes-ai-interactions-gui.mjs
      # markdown.css 的正文排版规则全部挂在 .msg.assistant .md-prose 下,少一层祖先
      # 就整层静默失效(分享页曾退回浏览器默认样式)。这类问题读代码看不出来,
      # 只能真浏览器量计算样式,并与应用内预览逐条比对。
      - name: 笔记分享页排版自检(与默认主题的应用内预览一致)
        run: node tests/note-share-gui.mjs
      # 「换设备不用重新设置」是本功能的核心承诺,只有「全新浏览器上下文登录同一账号」
      # 这条真实路径能验证:拉了不用、或应用后被当成本机改动再推回去,都会在这里暴露
      - name: 设置云同步 GUI 自检(新设备自动恢复 / 不反复重推)
        run: node tests/settings-sync-gui.mjs
      # 图片在 content 里内联成几十万字符的 base64,「新设备登录后图片变成一堆字符」
      # 只有「全新浏览器上下文登录同一账号」这条真实路径能复现(原设备手上有完整附件,不走这条路)。
      - name: 换设备对话图片渲染自检(附件重建 / 历史残片不画成乱码)
        run: node tests/chat-sync-image-gui.mjs
      # 浏览器加载正文里的 <img>/<a> 不会带 Authorization 头(登录态是 localStorage
      # 里的 Bearer 令牌),附件「只有本人可读」的判定必须同时认 Cookie —— 这类
      # 「curl 里正常、浏览器里裂图」的问题,只有真浏览器跑得出来。
      - name: 笔记内嵌附件自检(预览图片解码 / 下载链接直取)
        run: node tests/notes-image-gui.mjs
      # 「同一个框上两圈」「环只圈住框的一部分」都是 CSS 多层规则叠加出来的,
      # 看代码看不出来,必须真浏览器量计算样式;主题色「恢复默认」是 DOM 接线。
      # 字体切换往返同理:两款 CJK 切片字体共用同一个族名,谁在文档里靠后谁赢,
      # 切回已注入过的那款会「什么都不发生」—— 只有真浏览器切一遍才看得出来。
      # 注册勾选行换行是 .field input{width:100%} 与 .field{display:block}
      # 两个原因叠加,也得量几何。
      - name: 聚焦环 / 主题色 / 字体切换往返 / 注册勾选行排版自检
        run: node tests/focus-ring-gui.mjs
      # 发送前的校验没过时输入框却已被清空(群聊还没给角色分配模型最典型),用户的草稿与
      # 附件一起消失。这是「点发送」到「真的落消息」之间的时序问题,只能真浏览器按 Enter。
      - name: 输入框草稿保护自检(被拒不清空 / 正常发送照旧 / 生图视频空发先拦)
        run: node tests/composer-draft-gui.mjs
      # Markdown 允许渲染 HTML 后,渲染器就是最主要的 XSS 面:注入点用真浏览器跑,
      # 覆盖 mXSS / SVG 命名空间 / javascript: 混淆等浏览器行为相关的绕过。
      - name: Markdown 渲染安全自检(注入载荷被中和 / 正常 HTML 保留)
        run: node tests/renderer-xss.mjs
      # 主题包靠属性前缀提特异性,但 chrome.css 的字号总表与 markdown.css 的正文排版
      # 是 !important —— 那几处覆盖失效时界面只是「看起来没变化」,读代码看不出来
      # (主题初版有 5 处静默失效),只能真浏览器量计算样式;顺带守住「切回默认主题
      # 必须原样还原」与两行式输入框带来的底部留白联动。
      - name: ChatGPT 主题包自检(覆盖生效 / 深色 / 窄屏 / 切回默认还原)
        run: node tests/theme-gpt-gui.mjs
      # 方块主题的核心承诺是「不画分割线」—— 靠读 CSS 源码看不出哪条 border 没被压掉,
      # 必须真量一遍边框宽度;Claude 主题的整栏通排 + 加宽输入框会牵动底部留白,
      # 一并在这里量。
      - name: 方块 / Claude 主题包自检(边框归零 / 深色 / 窄屏 / 切回默认还原)
        run: node tests/theme-packs-gui.mjs
      # 两条都踩过,且都属于「读代码看不出来」:
      #   1) 被代理页里的 <form> 只把 action 换成代理地址是不够的 —— 浏览器提交时会丢掉
      #      action 上已有的查询串,于是搜索框点了跳到空页、地址栏也不动(必应实测过);
      #   2) index.php 开头 tc_send_cors() 给每个响应发的全局 X-Frame-Options: DENY +
      #      CSP frame-ancestors 'none' 会把代理页整个拦掉。成功分支写了覆盖,失败分支
      #      没写,于是抓取失败时用户看到一片空白而不是提示。
      # 后者只能真浏览器量:响应头列表里有没有那一行,和「浏览器肯不肯渲染」是两回事。
      - name: 在线浏览器表单提交 + 代理页可嵌自检(字段不丢 / 失败页不是白屏)
        run: node tests/web-form-submit.js
      # 工具箱的安全边界是「不透明源」——iframe 少一个 allow-same-origin 的写法,和
      # 响应头里 CSP sandbox 那一行,读源码都看不出浏览器到底把它关在什么里。这里让
      # 工具自己 postMessage 报出 window.origin 与 localStorage/Cookie 可达性,只有真跑
      # 一遍才有结论;顺带守住落库往返、墓碑、删除后 404、开关隐藏入口与窄屏。
      - name: 在线工具箱 GUI 自检(不透明源 / 新标签页端点 / 落库往返 / 窄屏)
        run: node tests/toolbox-gui.mjs
      # 上面那份管「工具箱这个功能」,这份管「装进去的那 12 套工具自己能不能用」。
      # 工具是纯前端页面,控件接线与算得对不对只有真引擎才有结论:事件名写错、公式算偏,
      # 静态检查(php -l / nowdoc 语法 / 禁用 storage)全都拦不住。二维码另走生成 → 识别
      # 闭环,并涂掉一块数据模块验纠错;深色主题再各走一遍防白底白字。
      - name: 内置工具逐套 GUI 自检(12 套联动 / 二维码往返与纠错 / 深色主题)
        run: node tests/toolbox-tools-gui.mjs
      # 「汇总后前台看上去就和只加了一个供应商的一个模型一样」这句承诺不是接口字段能保证的,
      # 而是后台面板画得出来 + 前台选择器最终显示成什么样。接口全对、列表里却仍是两条重复项,
      # 读代码看不出来 —— 只能真浏览器量 DOM(含「关掉开关后恢复成渠道@模型两条」)。
      # 另外钉的是几处「样式缺失/盒模型被祖先规则压扁」的排版:成员选择器此前**一条 CSS 都没有**
      # (JS 生成 ma-* 类,样式表里查无此类),开关的 <span class="switch"> 又被 .field span
      # 压成行盒高度导致白点溢出胶囊 —— 这些只能靠几何断言(勾选框/文字中心偏差、旋钮留白)。
      - name: 模型汇总 GUI 自检(面板渲染 / 前台只剩一条 / 弹窗排版几何 / Auto@ 标签 / 开关往返)
        run: node tests/model-groups-gui.mjs
      # 「生图留存文件」会随使用不断变长,此前平铺渲染会把整页撑得很长。折叠/分页都是
      # 渲染层行为(接口始终只给最近 30 个),必须在真浏览器里量:默认是否收起、
      # 展开后一页是否 10 行、翻页有没有真的换内容、末页按钮是否禁用。
      - name: 存储管理 GUI 自检(文件清单默认折叠 / 分页 / 末页边界 / 限高滚动)
        run: node tests/storage-panel-gui.mjs
      # 侧栏小开关的轨道高度被 style.css 的 min-height:26px 压过缩小版的 height:20px,
      # 于是轨道里空一大截(用户截图里的「开关样式乱了」);生图/生视频入口在「任意供应商
      # 有该类模型」时出现,而候选一度只列当前供应商 —— 当前供应商没有视频模型时下拉是空的。
      # 两者都只能真浏览器量(盒模型几何 / 下拉实际列出了哪些模型、选中后落到哪个供应商)。
      - name: 开关几何 + 生图生视频模型下拉 GUI 自检(轨道高度 / 跨供应商候选 / 偏好落库)
        run: node tests/media-toggle-gui.mjs
      # 发布说明是 GitHub Release 的 body(Markdown),此前直接塞进 <pre> 显示一堆 # 和 *;
      # 「渲染器在不在、渲染成什么」只有真浏览器量 DOM 才有结论。「自动更新」开关的默认值
      # 与「切换后是否真落库(而不是只改前端勾选)」两条各测一遍。缓存预置,用例不触网。
      - name: 版本更新面板 GUI 自检(发布说明 Markdown 渲染 / 自动更新开关默认开启并落库)
        run: node tests/update-panel-gui.mjs
      # 「API 对话单独成组、今天 API 紧跟今天」是纯渲染结果:接口字段全对,顺序或归属
      # 照样可能画错。用例走的是最真的路径(真调一次 /v1 生成接口会话),顺带守住
      # 「客户端把列表推回云端后标记不丢」—— 那个缺陷本机看不出来,换设备才炸。
      - name: API 对话分组 GUI 自检(顺序 / 归属 / 独立折叠 / 同步往返后不退化)
        run: node tests/chat-api-group-gui.mjs
      # localStorage 每源只有约 5MB,而会话里带着图片本体(一张 3MB 的图在本地就是 800 万字符:
      # content 内联一份、attachments 再存一份)。「写不下」只能在真浏览器里量:先二分出单键
      # 上限,再拿一份超过它的会话走一遍「写 → 拦截云同步重载读回」。
      # 顺带验旧键迁移(全新用户资料 + 只放 localStorage 的旧副本)与「浏览器不给用 IndexedDB
      # 时退回 localStorage」这条兜底 —— 后者决定了换存储会不会把页面弄坏。
      - name: 本地存储 GUI 自检(超 5MB 载荷往返 / 旧键迁移 / IDB 不可用兜底 / 笔记 / 换号清理)
        run: node tests/local-store-gui.mjs
      # 以前一张图在正文里内联了完整 base64:云同步每次白推几 MB(服务端再按 200000 上限切掉),
      # 本地副本也跟着翻倍;最要命的是分享页(只带 role+content)因为整段被切掉而**没图**。
      # 这里真上传一张 900×900 的图走完「发送 → 落库 → 分享 → 打开分享页」,量的是:
      # 正文里那份到底多大、本地副本有没有翻倍、气泡是否仍按原图渲染、分享页还看不看得见图,
      # 并用一组「老式内联」的分享做对照(它必须没图),证明用例不是在空转。
      - name: 正文内联图片 GUI 自检(缩略图化 / 附件保原图 / 分享页仍有图 / 对照)
        run: node tests/chat-image-preview-gui.mjs
