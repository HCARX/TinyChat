<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>登录 · TinyChat</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="登录 TinyChat：纯 PHP + SQLite 的自托管 AI 站点系统，支持多模型对话与 AI 生图。">
<link rel="icon" type="image/svg+xml" href="./logo-icon.svg">
<link rel="apple-touch-icon" href="./static/logo/app-icon-192.png">
<link rel="stylesheet" href="./static/css/style.min.css?v=2.0.161">
<link rel="stylesheet" href="./static/css/enhanced.min.css?v=2.0.161">
<link rel="stylesheet" href="./static/css/refine.min.css?v=2.0.161">
<link rel="stylesheet" href="./static/css/redesign.min.css?v=2.0.161">
<link rel="stylesheet" href="./static/css/polish.min.css?v=2.0.161">
<link rel="stylesheet" href="./static/css/chrome.min.css?v=2.0.161">
<script src="./static/js/theme-boot.min.js?v=2.0.161"></script>
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="./logo.svg" class="brand-logo brand-logo-light" alt="TinyChat">
      <img src="./logo-dark.svg" class="brand-logo brand-logo-dark" alt="TinyChat">
      <p class="muted">登录后继续对话</p>
    </div>
    <div id="auth-error" class="auth-error hidden" role="alert"></div>
    <div id="env-check-box" class="hidden" style="border:1px solid var(--hairline);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:var(--bg-surface,#f7f8f7)">
      <div style="font-weight:600;margin-bottom:8px">首次运行环境检查</div>
      <div id="env-check-list" style="font-size:13px;line-height:1.9"></div>
      <div class="row-between" style="margin-top:8px">
        <span class="muted small" id="env-check-status"></span>
        <span style="display:flex;gap:8px">
          <button type="button" class="btn small hidden" id="env-check-retry">重新检查</button>
          <button type="button" class="btn primary hidden" id="env-check-next">下一步：创建管理员</button>
        </span>
      </div>
    </div>
    <form id="setup-form" class="hidden" autocomplete="off">
      <p class="muted" style="margin:0 0 12px">还没有管理员。先设一个账号，再去后台添加供应商。</p>
      <label class="field">
        <span>管理员用户名</span>
        <input type="text" id="setup-name" name="setup-username" value="admin" required autocomplete="username" minlength="2">
      </label>
      <label class="field">
        <span>密码</span>
        <div class="pw-wrap">
          <input type="password" id="setup-password" name="setup-password" placeholder="至少 4 个字符" required autocomplete="new-password" minlength="4">
          <button type="button" class="pw-toggle" data-for="setup-password" aria-label="显示密码" title="显示密码">
            <svg class="eye-off oc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l16 16"/><path d="M9.4 9.6A3 3 0 0114.4 14.6"/><path d="M6.6 6.8A10.4 10.4 0 002.8 12s3.6 6.4 9.2 6.4a9.6 9.6 0 004.2-1M17.4 15.4A10 10 0 0021.2 12s-3.6-6.4-9.2-6.4a9.4 9.4 0 00-2.6.4"/></svg>
            <svg class="eye-on oc-icon hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.8 12s3.6-6.4 9.2-6.4S21.2 12 21.2 12s-3.6 6.4-9.2 6.4S2.8 12 2.8 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
          </button>
        </div>
      </label>
      <button type="submit" class="btn primary w-full" id="setup-btn">创建管理员</button>
    </form>
    <form id="login-form" autocomplete="on">
      <label class="field">
        <span>用户名</span>
        <input type="text" id="login-name" name="username" placeholder="请输入用户名" required autocomplete="username" autofocus>
      </label>
      <label class="field">
        <span>密码</span>
        <div class="pw-wrap">
          <input type="password" id="login-password" name="password" placeholder="请输入密码" required autocomplete="current-password">
          <button type="button" class="pw-toggle" data-for="login-password" aria-label="显示密码" title="显示密码">
            <svg class="eye-off oc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l16 16"/><path d="M9.4 9.6A3 3 0 0114.4 14.6"/><path d="M6.6 6.8A10.4 10.4 0 002.8 12s3.6 6.4 9.2 6.4a9.6 9.6 0 004.2-1M17.4 15.4A10 10 0 0021.2 12s-3.6-6.4-9.2-6.4a9.4 9.4 0 00-2.6.4"/></svg>
            <svg class="eye-on oc-icon hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.8 12s3.6-6.4 9.2-6.4S21.2 12 21.2 12s-3.6 6.4-9.2 6.4S2.8 12 2.8 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
          </button>
        </div>
      </label>
      <button type="submit" class="btn primary w-full" id="login-btn">登录</button>
      <p class="auth-switch"><a href="#" id="show-forgot">忘记密码？</a></p>
    </form>
    <form id="forgot-form" class="hidden" autocomplete="off">
      <label class="field"><span>注册邮箱</span><input type="email" id="forgot-email" placeholder="name@example.com" required autocomplete="email"></label>
      <button type="submit" class="btn primary w-full" id="forgot-btn">发送重置邮件</button>
      <p class="muted small" style="margin:10px 0 0;line-height:1.6">管理员账号不支持通过邮箱重置密码，请联系其他管理员在后台重置。</p>
      <p class="auth-switch"><a href="#" id="forgot-back">返回登录</a></p>
    </form>
    <form id="reset-form" class="hidden" autocomplete="off">
      <label class="field"><span>新密码</span><input type="password" id="reset-password" minlength="4" required autocomplete="new-password"></label>
      <label class="field"><span>确认密码</span><input type="password" id="reset-password2" minlength="4" required autocomplete="new-password"></label>
      <button type="submit" class="btn primary w-full" id="reset-btn">重置密码</button>
      <p class="auth-switch"><a href="#" id="reset-back">返回登录</a></p>
    </form>
    <p class="auth-switch" id="login-switch">还没有账号？<a href="#" id="show-register">立即注册</a></p>
    <!-- 第三方一键登录:后台启用哪个就显示哪个(登录/注册表单都显示) -->
    <div class="oauth-login hidden" id="oauth-login">
      <div class="oauth-sep"><span>或使用以下方式登录</span></div>
      <div class="oauth-icons" id="oauth-icons"></div>
    </div>
    <form id="register-form" class="hidden" autocomplete="off">
      <label class="field">
        <span>用户名</span>
        <input type="text" id="reg-name" name="reg-username" placeholder="至少 2 个字符" required autocomplete="username" minlength="2">
      </label>
      <label class="field">
        <span id="reg-email-label">邮箱（可选）</span>
        <input type="email" id="reg-email" name="reg-email" placeholder="用于验证和找回密码" autocomplete="email">
      </label>
      <label class="field">
        <span>密码</span>
        <div class="pw-wrap">
          <input type="password" id="reg-password" name="reg-password" placeholder="至少 4 个字符" required autocomplete="new-password" minlength="4">
          <button type="button" class="pw-toggle" data-for="reg-password" aria-label="显示密码" title="显示密码">
            <svg class="eye-off oc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l16 16"/><path d="M9.4 9.6A3 3 0 0114.4 14.6"/><path d="M6.6 6.8A10.4 10.4 0 002.8 12s3.6 6.4 9.2 6.4a9.6 9.6 0 004.2-1M17.4 15.4A10 10 0 0021.2 12s-3.6-6.4-9.2-6.4a9.4 9.4 0 00-2.6.4"/></svg>
            <svg class="eye-on oc-icon hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.8 12s3.6-6.4 9.2-6.4S21.2 12 21.2 12s-3.6 6.4-9.2 6.4S2.8 12 2.8 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
          </button>
        </div>
      </label>
      <label class="field hidden" id="reg-invite-row">
        <span>邀请码</span>
        <input type="text" id="reg-invite" placeholder="向管理员索取" autocomplete="off" style="text-transform:uppercase">
      </label>
      <label class="field agree-row hidden" id="reg-agree-row">
        <input type="checkbox" id="reg-agree">
        <span class="agree-text">我已阅读并同意<a href="/agreement" target="_blank" rel="noopener">《用户协议》</a></span>
      </label>
      <button type="submit" class="btn primary w-full" id="register-btn">注册并登录</button>
      <p class="auth-switch"><a href="#" id="show-login">返回登录</a></p>
    </form>
  </div>
<script defer src="./static/js/config.min.js?v=2.0.161"></script>
<script defer src="./static/js/ui.min.js?v=2.0.161"></script>
<script defer src="./static/js/login.min.js?v=2.0.161"></script>
</body>
</html>
